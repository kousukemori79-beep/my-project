<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>経費精算</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Noto Sans JP", sans-serif; background: #f5f7fa; color: #333; line-height: 1.6; }

    .header {
      background: linear-gradient(135deg, #00695c, #00897b);
      color: #fff;
      padding: 32px;
    }
    .header h1 { font-size: 24px; }
    .header p { opacity: 0.8; font-size: 13px; }

    .container { max-width: 800px; margin: 0 auto; padding: 24px 16px; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card h2 {
      font-size: 16px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e0f2f1;
      color: #00695c;
    }

    .total-box {
      text-align: center;
      padding: 20px;
    }
    .total-label { font-size: 13px; color: #888; }
    .total-value { font-size: 36px; font-weight: 700; color: #00695c; }

    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 12px; color: #666; margin-bottom: 4px; }
    .form-group input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    .form-group input:focus { outline: none; border-color: #00897b; }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary { background: #00897b; color: #fff; align-self: flex-end; }
    .btn-primary:hover { background: #00695c; }
    .btn-danger {
      background: none;
      color: #c62828;
      font-size: 12px;
      padding: 4px 8px;
    }
    .btn-danger:hover { background: #ffebee; border-radius: 4px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f5f7fa; color: #555; font-weight: 600; }
    td.amount { text-align: right; font-weight: 600; }
    th.amount { text-align: right; }
    tr:hover { background: #fafffe; }

    .empty { text-align: center; color: #aaa; padding: 32px; font-size: 14px; }

    .error { color: #c62828; font-size: 13px; margin-top: 8px; display: none; }
  </style>
</head>
<body>

<div class="header">
  <div style="max-width:800px;margin:0 auto;">
    <h1>経費精算</h1>
    <p>経費の登録・一覧管理</p>
  </div>
</div>

<div class="container">

  <div class="card total-box">
    <div class="total-label">合計金額</div>
    <div class="total-value" id="total">¥0</div>
  </div>

  <div class="card">
    <h2>経費を登録</h2>
    <form id="expense-form">
      <div class="form-row">
        <div class="form-group" style="flex:0 0 150px;">
          <label for="date">日付</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-group" style="flex:1; min-width:150px;">
          <label for="description">内容</label>
          <input type="text" id="description" placeholder="例: タクシー代" required>
        </div>
        <div class="form-group" style="flex:0 0 130px;">
          <label for="amount">金額 (円)</label>
          <input type="number" id="amount" min="0" placeholder="1000" required>
        </div>
        <button type="submit" class="btn btn-primary">登録</button>
      </div>
      <div class="error" id="error"></div>
    </form>
  </div>

  <div class="card">
    <h2>経費一覧</h2>
    <div id="expense-list"></div>
  </div>

</div>

<script>
  const form = document.getElementById("expense-form");
  const listEl = document.getElementById("expense-list");
  const totalEl = document.getElementById("total");
  const errorEl = document.getElementById("error");

  // 今日の日付をデフォルトにセット
  document.getElementById("date").valueAsDate = new Date();

  async function loadExpenses() {
    const res = await fetch("/api/expenses");
    const data = await res.json();
    totalEl.textContent = "¥" + data.total.toLocaleString();

    if (data.expenses.length === 0) {
      listEl.innerHTML = '<div class="empty">経費データがありません</div>';
      return;
    }

    // 日付の新しい順に表示
    const sorted = [...data.expenses].sort((a, b) => b.id - a.id);

    let html = '<table><thead><tr><th>日付</th><th>内容</th><th class="amount">金額</th><th></th></tr></thead><tbody>';
    for (const e of sorted) {
      html += `<tr>
        <td>${e.date}</td>
        <td>${escapeHtml(e.description)}</td>
        <td class="amount">¥${e.amount.toLocaleString()}</td>
        <td><button class="btn btn-danger" onclick="deleteExpense(${e.id})">削除</button></td>
      </tr>`;
    }
    html += "</tbody></table>";
    listEl.innerHTML = html;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";

    const date = document.getElementById("date").value;
    const description = document.getElementById("description").value.trim();
    const amount = Number(document.getElementById("amount").value);

    const res = await fetch("/api/expenses", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date, description, amount }),
    });

    if (!res.ok) {
      const err = await res.json();
      errorEl.textContent = err.error;
      errorEl.style.display = "block";
      return;
    }

    document.getElementById("description").value = "";
    document.getElementById("amount").value = "";
    await loadExpenses();
  });

  async function deleteExpense(id) {
    if (!confirm("この経費を削除しますか？")) return;
    await fetch("/api/expenses/" + id, { method: "DELETE" });
    await loadExpenses();
  }

  loadExpenses();
</script>
</body>
</html>
